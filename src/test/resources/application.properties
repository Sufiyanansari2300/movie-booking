spring.application.name=movie-booking

# H2 in-memory database (tests only), MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:movie_booking;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Store Instant as plain TIMESTAMP in UTC (portable between MySQL and H2)
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Test-only bootstrap admin (fixture value, not a real credential)
app.admin.name=Test Admin
app.admin.email=admin@test.local
app.admin.password=admin-test-password

# Test-only JWT signing key (fixture value, not a real secret)
app.jwt.secret=test-only-jwt-secret-0123456789abcdef-not-for-production
app.jwt.expiration=24h
app.jwt.issuer=movie-booking

app.timezone=Asia/Kolkata
app.shows.cleanup-buffer=15m
app.booking.hold-duration=10m
app.booking.max-seats-per-booking=10
app.booking.expiry-sweep-interval=30s
# Tests run background jobs explicitly
app.scheduling.enabled=false
app.payment.currency=INR
app.notifications.reminder-lead-time=2h
app.notifications.reminder-interval=5m
app.notifications.retry-interval=60s
app.notifications.max-attempts=3
