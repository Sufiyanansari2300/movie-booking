spring.application.name=movie-booking

# Optional git-ignored file for local secrets (e.g. DB password)
spring.config.import=optional:file:./local.properties
server.port=8090
# MySQL (main database) - override via environment variables
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:movie_booking}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Bootstrap admin (password from ADMIN_PASSWORD or local.properties; skipped if empty)
app.admin.name=${ADMIN_NAME:Administrator}
app.admin.email=${ADMIN_EMAIL:admin@moviebooking.local}
app.admin.password=${ADMIN_PASSWORD:}

# JWT access tokens (secret from JWT_SECRET or local.properties, min 32 bytes)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION:24h}
app.jwt.issuer=movie-booking

# Business time zone for calendar logic (show dates, weekend pricing); times are stored in UTC
app.timezone=${APP_TIMEZONE:Asia/Kolkata}
# Gap after a movie before the next show on the same screen
app.shows.cleanup-buffer=15m

# Seat holds: how long seats stay reserved while paying, and how often expired holds are swept
app.booking.hold-duration=${BOOKING_HOLD_DURATION:10m}
app.booking.max-seats-per-booking=10
app.booking.expiry-sweep-interval=30s

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway owns the schema (src/main/resources/db/migration)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Store Instant as plain TIMESTAMP in UTC (portable between MySQL and H2)
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

# Pagination limits for list endpoints
spring.data.web.pageable.max-page-size=100

# OpenAPI / Swagger UI (/swagger-ui.html, spec at /v3/api-docs)
springdoc.default-produces-media-type=application/json
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
